<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f6bff">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>時間管家</title>
<style>
/* 時間管家：行事曆 × 待辦 × 筆記 單檔小程式
   資料存在瀏覽器 localStorage（離線可用）；Google 日曆 / Gmail / Tasks 透過選填的 OAuth Client ID 串接。 */
:root{
  --bg:#f4f6fb;--panel:#fff;--panel2:#f0f2f8;--hover:#eef1fa;--text:#1b2232;--muted:#646d82;--faint:#9aa1b2;--line:#e3e6ee;
  --accent:#4f6bff;--accent2:#7c5cff;--accent-soft:#e9edff;--ok:#1f9d63;--warn:#e8930c;--danger:#e5484d;--violet:#8b5cf6;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 4px 14px rgba(16,24,40,.06);--shadow-lg:0 24px 60px rgba(16,24,40,.22);
  --r:12px;--hourH:48px;--font:"Microsoft JhengHei","微軟正黑體","PingFang TC","Noto Sans TC",system-ui,sans-serif;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1117;--panel:#161a22;--panel2:#1c212b;--hover:#232938;--text:#e6e9f0;--muted:#9aa2b5;--faint:#69708a;--line:#2a303d;
  --accent:#7d8dff;--accent2:#a28dff;--accent-soft:#242b48;--ok:#3cc183;--warn:#f2a93b;--danger:#f0686c;--violet:#a78bfa;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);--shadow-lg:0 24px 60px rgba(0,0,0,.55);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1117;--panel:#161a22;--panel2:#1c212b;--hover:#232938;--text:#e6e9f0;--muted:#9aa2b5;--faint:#69708a;--line:#2a303d;
  --accent:#7d8dff;--accent2:#a28dff;--accent-soft:#242b48;--ok:#3cc183;--warn:#f2a93b;--danger:#f0686c;--violet:#a78bfa;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);--shadow-lg:0 24px 60px rgba(0,0,0,.55);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
input,select,textarea{font:inherit;color:inherit}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
.app{display:grid;grid-template-columns:250px 1fr;height:100dvh}
/* ---------- 側欄 ---------- */
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow-y:auto;padding:14px 10px 12px;gap:4px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;padding:2px 8px 12px}
.logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:grid;place-items:center;box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 40%,transparent)}
.cap-btn{display:flex;align-items:center;gap:8px;width:100%;padding:10px 12px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:600;margin-bottom:8px;box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 35%,transparent)}
.cap-btn kbd{margin-left:auto;background:rgba(255,255,255,.22);border:0;color:#fff}
kbd{font-family:ui-monospace,Consolas,monospace;font-size:11px;padding:1px 6px;border-radius:5px;border:1px solid var(--line);background:var(--panel2);color:var(--muted)}
.nav{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:9px;color:var(--muted);font-weight:500;text-align:left}
.nav:hover{background:var(--hover);color:var(--text)}
.nav.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .cnt{margin-left:auto;font-size:12px;min-width:20px;text-align:center;padding:0 6px;border-radius:10px;background:var(--panel2);color:var(--muted)}
.nav.on .cnt{background:var(--accent);color:#fff}
.sec-h{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--faint);font-weight:600;letter-spacing:.04em;padding:14px 10px 4px}
.sec-h button{color:var(--faint);padding:2px;border-radius:6px}.sec-h button:hover{color:var(--accent);background:var(--hover)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--c,var(--accent))}
.tagcloud{display:flex;flex-wrap:wrap;gap:6px;padding:4px 8px}
.tag{display:inline-flex;align-items:center;gap:3px;font-size:12px;padding:1px 8px;border-radius:20px;background:var(--panel2);color:var(--muted);white-space:nowrap}
button.tag:hover,.tag.on{background:var(--accent-soft);color:var(--accent)}
.side-foot{margin-top:auto;padding:10px 8px 0;font-size:12px;color:var(--faint);display:flex;align-items:center;gap:6px}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
/* ---------- 主區 ---------- */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;min-height:58px}
.ttl{font-size:18px;font-weight:700;margin-right:4px;white-space:nowrap}
.ibtn{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px;color:var(--muted);position:relative}
.ibtn:hover{background:var(--hover);color:var(--text)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font-weight:500;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}.btn.pri:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--danger)}
.btn.sm{padding:4px 9px;font-size:12.5px;border-radius:7px}
.seg{display:inline-flex;background:var(--panel2);border-radius:10px;padding:3px}
.seg button{padding:5px 14px;border-radius:8px;color:var(--muted);font-weight:500}
.seg button.on{background:var(--panel);color:var(--text);box-shadow:var(--shadow)}
.grow{flex:1}
.search{position:relative}
.search input{width:220px;padding:7px 10px 7px 32px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);outline:none}
.search input:focus{border-color:var(--accent);background:var(--panel)}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--faint);width:16px}
.sres{position:absolute;right:0;top:calc(100% + 6px);width:340px;max-height:60vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);z-index:50;padding:6px}
.sres .r{padding:8px 10px;border-radius:8px;cursor:pointer}.sres .r:hover{background:var(--hover)}
.sres .r small{color:var(--muted);display:block}
.badge{position:absolute;top:3px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--danger);color:#fff;font-size:10px;line-height:16px;font-weight:700}
.cdot{position:absolute;right:4px;bottom:5px;width:9px;height:9px;border-radius:50%;border:2px solid var(--panel);background:var(--faint)}
#cloudBtn.ok .cdot{background:var(--ok)}#cloudBtn.pending .cdot{background:var(--warn)}#cloudBtn.login .cdot,#cloudBtn.error .cdot{background:var(--danger)}
#cloudBtn.syncing svg{animation:pulse 1s infinite;color:var(--accent)}#cloudBtn.syncing .cdot{background:var(--accent)}
.timer-pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:20px;background:color-mix(in srgb,var(--danger) 14%,var(--panel));color:var(--danger);font-weight:700;font-variant-numeric:tabular-nums}
.content{flex:1;overflow:auto;position:relative;min-height:0}
.pad{padding:18px 20px 90px;max-width:980px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.empty{padding:36px 16px;text-align:center;color:var(--faint)}
.empty .big{font-size:34px;margin-bottom:6px}
h2.vh{font-size:20px;margin:0 0 4px}
.vsub{color:var(--muted);margin:0 0 16px}
/* ---------- 月檢視 ---------- */
.month{display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:auto repeat(6,minmax(96px,1fr));height:100%;min-height:620px;background:var(--line);gap:1px}
.mhd{background:var(--panel);text-align:center;padding:8px 0;font-size:12px;color:var(--muted);font-weight:600}
.mcell{background:var(--panel);padding:4px 5px;min-width:0;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.mcell:hover{background:var(--hover)}
.mcell.other{background:var(--panel2)}.mcell.other .mnum{color:var(--faint)}
.mnum{font-size:12.5px;font-weight:600;width:24px;height:24px;display:grid;place-items:center;border-radius:50%;margin-bottom:1px}
.mcell.today .mnum{background:var(--accent);color:#fff}
.mcell.wkend .mnum{color:var(--danger)}.mcell.today.wkend .mnum{color:#fff}
.chip{display:flex;align-items:center;gap:4px;font-size:12px;padding:1px 6px;border-radius:5px;background:color-mix(in srgb,var(--c) 15%,var(--panel));color:color-mix(in srgb,var(--c) 75%,var(--text));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:grab;border-left:3px solid var(--c);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;min-height:20px}
.chip .tm{opacity:.75;font-variant-numeric:tabular-nums}
.chip.done{text-decoration:line-through;opacity:.55}
.chip span.t{overflow:hidden;text-overflow:ellipsis}
.more{font-size:11.5px;color:var(--muted);padding:0 6px}
/* ---------- 週 / 日 時間格 ---------- */
.cal-wrap{display:flex;height:100%;min-height:0}
.tg-wrap{flex:1;overflow:auto;min-width:0;position:relative;background:var(--panel)}
.tg{display:grid;min-width:var(--tgmin,0)}
.tg-head{position:sticky;top:0;z-index:6;display:grid;background:var(--panel);border-bottom:1px solid var(--line)}
.tg-dh{text-align:center;padding:6px 0 6px;cursor:pointer;border-left:1px solid var(--line)}
.tg-dh span{display:block;font-size:12px;color:var(--muted)}
.tg-dh b{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;font-size:17px}
.tg-dh.today b{background:var(--accent);color:#fff}.tg-dh.today span{color:var(--accent);font-weight:600}
.tg-ad{display:grid;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:59px;z-index:5}
.tg-adc{border-left:1px solid var(--line);padding:3px;min-height:28px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tg-g{font-size:11px;color:var(--faint);text-align:right;padding:4px 6px 0 0}
.tg-body{display:grid;position:relative}
.tg-hours{position:relative}
.tg-hours div{height:var(--hourH);font-size:11px;color:var(--faint);text-align:right;padding-right:6px;transform:translateY(-7px)}
.tg-col{position:relative;border-left:1px solid var(--line);background-image:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px calc(var(--hourH)/2),color-mix(in srgb,var(--line) 45%,transparent) calc(var(--hourH)/2) calc(var(--hourH)/2 + 1px),transparent calc(var(--hourH)/2 + 1px) var(--hourH));cursor:copy}
.tg-col.off{background-color:color-mix(in srgb,var(--panel2) 70%,transparent)}
.tg-col .work{position:absolute;left:0;right:0;background:color-mix(in srgb,var(--accent) 3%,transparent);pointer-events:none}
.ev{position:absolute;border-radius:7px;padding:3px 6px;font-size:12px;overflow:hidden;background:color-mix(in srgb,var(--c) 17%,var(--panel));color:color-mix(in srgb,var(--c) 72%,var(--text));border-left:3px solid var(--c);cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;box-shadow:0 1px 2px rgba(0,0,0,.06);z-index:2}
.ev:hover{z-index:3;box-shadow:var(--shadow)}
.ev .et{font-weight:600;line-height:1.25;display:flex;gap:3px;align-items:flex-start}
.ev .tm{font-size:11px;opacity:.8;font-variant-numeric:tabular-nums}
.ev.done{opacity:.5}.ev.done .et{text-decoration:line-through}
.ev.prot{background-image:repeating-linear-gradient(135deg,transparent 0 6px,color-mix(in srgb,var(--c) 10%,transparent) 6px 12px)}
.ev .rs{position:absolute;left:0;right:0;bottom:0;height:8px;cursor:ns-resize;touch-action:none}
.ev .rs::after{content:"";position:absolute;left:50%;bottom:2px;width:18px;height:3px;margin-left:-9px;border-radius:2px;background:currentColor;opacity:0}
.ev:hover .rs::after{opacity:.35}
.ev svg.i{width:12px;height:12px;margin-top:2px}
.nowline{position:absolute;left:-1px;right:0;height:2px;background:var(--danger);z-index:4;pointer-events:none}
.nowline::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--danger)}
.ck{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;flex:none;display:inline-grid;place-items:center;margin-top:1px;cursor:pointer}
.ck.on{background:currentColor}.ck.on::after{content:"";width:4px;height:7px;border:solid var(--panel);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
/* 日/週側邊面板 */
.dside{width:300px;flex:none;border-left:1px solid var(--line);background:var(--bg);overflow-y:auto;padding:14px}
.dside h4{margin:14px 0 8px;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dside h4:first-child{margin-top:0}
.ai-card{border-radius:12px;padding:12px;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 12%,var(--panel)),color-mix(in srgb,var(--accent2) 10%,var(--panel)));border:1px solid color-mix(in srgb,var(--accent) 25%,var(--line));font-size:13px}
.ai-card b{color:var(--accent)}
.mini-task{display:flex;align-items:center;gap:8px;padding:7px 9px;background:var(--panel);border:1px solid var(--line);border-radius:9px;margin-bottom:6px;cursor:grab;font-size:13px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;border-left:3px solid var(--c,var(--line))}
.mini-task .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
textarea.daily{width:100%;min-height:110px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--panel);resize:vertical;outline:none}
textarea.daily:focus{border-color:var(--accent)}
/* ---------- 任務清單 ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.fchip{padding:5px 12px;border-radius:20px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:13px}
.fchip.on{background:var(--accent);border-color:var(--accent);color:#fff}
select.sel{padding:6px 10px;border-radius:9px;border:1px solid var(--line);background:var(--panel)}
.qadd{display:flex;gap:8px;align-items:center;padding:6px 6px 6px 14px;margin-bottom:14px}
.qadd input{flex:1;border:0;outline:none;background:transparent;padding:8px 0;font-size:15px;min-width:0}
.qprev{display:flex;flex-wrap:wrap;gap:5px;margin:-6px 2px 12px;min-height:0}
.pv{font-size:12px;padding:2px 9px;border-radius:20px;background:var(--accent-soft);color:var(--accent)}
.grp-h{font-size:13px;font-weight:700;color:var(--muted);margin:16px 4px 8px;display:flex;align-items:center;gap:8px}
.grp-h.over{color:var(--danger)}
.grp-h .n{font-weight:500;color:var(--faint)}
.trow{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:11px;margin-bottom:7px;cursor:pointer;position:relative;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:box-shadow .15s}
.trow:hover{box-shadow:var(--shadow)}
.trow::before{content:"";position:absolute;left:-1px;top:10px;bottom:10px;width:3px;border-radius:2px;background:var(--pc,transparent)}
.chk{width:20px;height:20px;border-radius:6px;border:2px solid var(--pc,var(--faint));flex:none;margin-top:1px;display:grid;place-items:center;transition:.15s}
.chk:hover{background:color-mix(in srgb,var(--pc,var(--accent)) 15%,transparent)}
.chk.on{background:var(--ok);border-color:var(--ok)}
.chk.on::after{content:"";width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.tmain{flex:1;min-width:0}
.ttitle{font-weight:500;word-break:break-word}
.trow.done .ttitle{text-decoration:line-through;color:var(--faint)}
.tmeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;font-size:12px;color:var(--muted);align-items:center}
.tmeta .m{display:inline-flex;align-items:center;gap:3px}
.tmeta svg.i{width:13px;height:13px}
.m.over{color:var(--danger);font-weight:600}.m.today{color:var(--accent);font-weight:600}
.stars{display:flex;gap:1px;flex:none}
.stars button{color:var(--line);padding:1px}.stars button.on{color:var(--warn)}
.stars svg.i{width:15px;height:15px}.stars button.on svg{fill:currentColor}
.subs{margin-top:6px;display:flex;flex-direction:column;gap:3px}
.sub{display:flex;gap:7px;align-items:center;font-size:13px;color:var(--muted)}
.sub .chk{width:15px;height:15px;border-radius:4px;border-width:2px}.sub .chk.on::after{width:4px;height:7px}
.sub.done span{text-decoration:line-through;color:var(--faint)}
.prog{height:4px;border-radius:2px;background:var(--panel2);overflow:hidden;width:60px;display:inline-block}
.prog i{display:block;height:100%;background:var(--ok)}
.row-acts{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
/* ---------- 看板 ---------- */
.kanban{display:grid;grid-template-columns:repeat(3,minmax(260px,1fr));gap:14px;padding:18px 20px 90px;min-height:100%;align-items:start;overflow-x:auto}
.kcol{background:var(--panel2);border-radius:14px;padding:10px;min-height:300px;border:2px solid transparent}
.kcol h3{margin:2px 4px 10px;font-size:14px;display:flex;align-items:center;gap:8px}
.kcol h3 .n{color:var(--faint);font-weight:500}
.kcard{background:var(--panel);border-radius:10px;padding:10px 11px;margin-bottom:8px;box-shadow:var(--shadow);cursor:grab;border-top:3px solid var(--pc,var(--line));user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.kcard .ttitle{font-size:13.5px}
/* ---------- 筆記 ---------- */
.notes{display:grid;grid-template-columns:300px 1fr;height:100%;min-height:0}
.nlist{border-right:1px solid var(--line);overflow-y:auto;padding:12px;background:var(--panel)}
.nitem{padding:10px 12px;border-radius:10px;cursor:pointer;margin-bottom:4px}
.nitem:hover{background:var(--hover)}.nitem.on{background:var(--accent-soft)}
.nitem b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nitem small{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ned{display:flex;flex-direction:column;padding:18px 24px;gap:10px;min-height:0;overflow:auto}
.ned input.nt{font-size:22px;font-weight:700;border:0;outline:none;background:transparent;padding:4px 0}
.ned textarea{flex:1;min-height:300px;border:0;outline:none;background:transparent;resize:none;font-size:15px;line-height:1.75}
.nmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:13px}
.nmeta input{border:1px solid var(--line);border-radius:8px;padding:4px 8px;background:var(--panel)}
/* ---------- 專注 ---------- */
.focus{display:grid;grid-template-columns:1fr 320px;gap:18px;padding:22px;max-width:1000px;margin:0 auto 80px}
.ring-wrap{display:flex;flex-direction:column;align-items:center;padding:28px 16px;gap:18px}
.ring{position:relative;width:min(300px,72vw);aspect-ratio:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .tx{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .tx b{font-size:clamp(44px,12vw,64px);font-variant-numeric:tabular-nums;letter-spacing:-.02em;display:block;line-height:1}
.ring .tx span{color:var(--muted)}
.stat{display:flex;gap:10px}
.stat div{flex:1;padding:14px;border-radius:12px;background:var(--panel2);text-align:center}
.stat b{display:block;font-size:24px}
/* ---------- 習慣 ---------- */
.habit{display:flex;align-items:center;gap:14px;padding:14px 16px;margin-bottom:10px;flex-wrap:wrap}
.habit .ic{font-size:26px;width:44px;height:44px;border-radius:12px;background:var(--panel2);display:grid;place-items:center}
.habit .nm{flex:1;min-width:120px}

function chipHTML(en){

function monthView(c){

function layoutDay(list){
  list.sort((a,b)=>a.s-b.s||b.e-a.e); const out=[]; let group=[],gEnd=0,cols=[];
  const flush=()=>{const n=cols.length;group.forEach(g=>{g.n=n});out.push(...group);group=[];cols=[]};
  for(const en of list){
    if(group.length&&en.s>=gEnd)flush();
    let ci=cols.findIndex(e=>e<=en.s); if(ci<0){ci=cols.length;cols.push(0)} cols[ci]=en.e; en.col=ci; group.push(en); gEnd=Math.max(gEnd,+en.e);
  }

}
function timeGrid(c,days){

    const evs=L.map(en=>{const it=en.it,s=en.s<ds?ds:en.s,e=en.e>de?de:en.e;const top=minsOf(s)/60*H,h=Math.max((e-s)/36e5*H,18);const w=100/en.n,l=en.col*w;const task=it.type==='task';
      return `<div class="ev ${task&&isDone(it)?'done':''} ${it.protected?'prot':''}" style="top:${top}px;height:${h-2}px;left:calc(${l}% + 2px);width:calc(${w}% - 4px);--c:${colorOf(it)}" data-drag="${en.key}" data-open="${it.id}" ${en.occ?`data-occ="${en.occ}"`:''} data-dur="${(en.e-en.s)/6e4}">
        <div class="et">${task?`<span class="ck ${isDone(it)?'on':''}" data-act="toggle" data-id="${it.id}"></span>`:''}${it.protected?ic('lock'):''}${it.repeat?ic('repeat'):''}${it.meet?ic('video'):''}<span>${esc(it.title)}</span></div>
        ${h>30?`<div class="tm">${hm(en.s)}–${hm(en.e)}</div>`:''}<div class="rs" data-resize="${en.key}"></div></div>`}).join('');
    const now=new Date(); const nl=k===tk?`<div class="nowline" style="top:${minsOf(now)/60*H}px"></div>`:'';

    return `<div class="tg-col ${off?'off':''}" data-drop="col:${k}" data-date="${k}" style="height:${24*H}px">${off?'':`<div class="work" style="top:${ws*H}px;height:${(we-ws)*H}px"></div>`}${evs}${nl}</div>`;
  }).join('');
  const body=`<div class="tg-body" style="grid-template-columns:${cols}">${hours}${colsHTML}</div>`;
  const side=dayPanel(days.length===1?days[0]:null);

function dayInsight(d){
  const ds=sod(d),de=addD(ds,1),ent=entriesIn(ds,de).filter(e=>!e.allDay);
  const ws=addM(ds,S.settings.workStart*60),we=addM(ds,S.settings.workEnd*60);
  let busy=0;const iv=ent.map(e=>[Math.max(+e.s,+ws),Math.min(+e.e,+we)]).filter(x=>x[1]>x[0]).sort((a,b)=>a[0]-b[0]);
  let cur=null;for(const x of iv){if(!cur||x[0]>cur[1]){if(cur)busy+=cur[1]-cur[0];cur=[...x]}else cur[1]=Math.max(cur[1],x[1])}if(cur)busy+=cur[1]-cur[0];
  const free=Math.max(0,(we-ws-busy)/6e4);
  const tasks=S.items.filter(i=>i.type==='task'&&!isDone(i)&&i.due&&P(i.due)<de);
  const top=[...tasks].sort(taskSort)[0];
  const conflicts=ent.filter((a,i)=>ent.some((b,j)=>j>i&&a.s<b.e&&b.s<a.e)).length;
  const est=tasks.reduce((s,i)=>s+(i.est||30),0);
  let msg=`今天有 <b>${ent.length}</b> 個時段安排、<b>${tasks.length}</b> 項到期任務，工作時間內約有 <b>${fmtDur(Math.round(free))}</b> 空檔。`;
  if(est>free&&tasks.length)msg+=` ⚠️ 任務預估 ${fmtDur(est)}，超過空檔，建議延後低優先項目。`;
  if(conflicts)msg+=` ⚠️ 偵測到 ${conflicts} 組時間衝突。`;
  if(top)msg+=`<br>👉 建議先處理：<b>${esc(top.title)}</b>`;
  return msg;
}

function taskSort(a,b){
  const da=a.due?+P(a.due):Infinity,db=b.due?+P(b.due):Infinity;
  if(U.f.sort==='pri')return b.priority-a.priority||da-db;
  if(U.f.sort==='due')return da-db||b.priority-a.priority;
  if(U.f.sort==='new')return b.created-a.created;
  const today=+addD(sod(new Date()),1);const ua=da<today?2:0,ub=db<today?2:0;
  return (ub+b.priority)-(ua+a.priority)||da-db||b.created-a.created;
}

function filterTasks(){

let modalClose=null;
function openModal(html,{wide,onClose,init}={}){
  closeModal(true);
  const root=$('#modalRoot');root.innerHTML=`<div class="ov" id="ov"><div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true">${html}</div></div>`;
  const ov=$('#ov');ov.addEventListener('pointerdown',e=>{if(e.target===ov)ov._down=true});ov.addEventListener('click',e=>{if(e.target===ov&&ov._down)closeModal();ov._down=false});
  modalClose=onClose||null; if(init)init($('.modal',root));
  setTimeout(()=>{const f=$('.modal [autofocus]');if(f){f.focus();if(f.select&&f.value)f.setSelectionRange(f.value.length,f.value.length)}},30);
  return $('.modal',root);
}
function closeModal(silent){const root=$('#modalRoot');if(!root.innerHTML)return;root.innerHTML='';const f=modalClose;modalClose=null;if(f&&!silent)f()}
const isModal=()=>!!$('#modalRoot').innerHTML;
function toast(msg,o={}){
  const el=document.createElement('div');el.className='toast';el.innerHTML=`<span>${msg}</span>${o.undo?'<button data-u>復原</button>':''}${o.action?`<button data-a>${o.action.label}</button>`:''}`;
  el.querySelector('[data-u]')?.addEventListener('click',()=>{undo();el.remove()});
  el.querySelector('[data-a]')?.addEventListener('click',()=>{o.action.fn();el.remove()});
  const box=$('#toasts');box.appendChild(el);while(box.children.length>3)box.firstElementChild.remove();setTimeout(()=>el.remove(),o.ms||(o.undo||o.action?6000:3200));
}
function choose(title,msg,buttons){return new Promise(res=>{openModal(`<div class="mh"><h3>${title}</h3></div><div class="mb">${msg}</div><div class="mf"><span class="grow"></span>${buttons.map((b,i)=>`<button class="btn ${b.cls||''}" data-ch="${i}">${b.label}</button>`).join('')}</div>`,{onClose:()=>res(null),init:m=>m.addEventListener('click',e=>{const b=e.target.closest('[data-ch]');if(b){modalClose=null;closeModal(true);res(buttons[+b.dataset.ch].v)}})})})}
function download(name,text,type='text/plain'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:type+';charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}

function openEditor(id,occ,preset){
  const isNew=!id||!getItem(id);
  const it=JSON.parse(JSON.stringify(isNew?Object.assign(newItem(preset?.type||'task'),preset||{}):getItem(id)));

    [/學|讀|課程|考試|證照/,['設定學習目標與期限','拆分章節與進度','每日固定學習時段','做練習題 / 筆記','模擬測驗與複習']],
    [/採購|買|訂購/,['列出需求規格','比價 2–3 家','確認預算並核准','下單','驗收']],
    [/活動|發表|研討|直播/,['確認目標與預算','確定時間地點 / 平台','準備內容與講者','宣傳與報名','彩排','活動執行','會後回饋與檢討']],
    [/專案|系統|開發|上線/,['定義範疇與成功標準','拆解 WBS 與時程','識別風險與應對','執行與每週追蹤','驗收','結案與經驗回顧']],

   自動避讓 / AI 智慧排程
   ========================================================= */
function conflictsAt(s,e,exId){return entriesIn(addD(sod(s),-1),addD(sod(e),1)).filter(b=>!b.allDay&&b.it.id!==exId&&!(b.it.type==='task'&&isDone(b.it))&&b.s<e&&b.e>s)}
function avoid(it){
  if(!it.start||it.allDay||it.repeat)return null;
  let s=P(it.start),e=P(it.end)||addM(s,60);const dur=e-s;
  let cs=conflictsAt(s,e,it.id);if(!cs.length)return null;
  const hard=cs.some(b=>b.it.protected)&&!it.protected;
  if(!S.settings.autoAvoid&&!hard)return{warn:cs};
  let t=s;for(let i=0;i<60&&cs.length;i++){t=new Date(Math.max(...cs.map(b=>+b.e)));cs=conflictsAt(t,new Date(+t+dur),it.id)}
  if(cs.length)return{warn:cs};
  it.start=iso(t);it.end=iso(new Date(+t+dur));return{moved:t,by:'衝突'};
}
function freeSlot(after,dur,deadline,busyExtra){
  const ws=S.settings.workStart,we=S.settings.workEnd;let d=sod(after);
  for(let day=0;day<14;day++,d=addD(d,1)){
    if(d.getDay()===0||d.getDay()===6)continue;
    let t=new Date(Math.max(+addM(d,ws*60),+after));t=roundUp(addM(t,-1),15);
    const end=addM(d,we*60);
    while(+t+dur*6e4<=+end){const te=addM(t,dur);
      const c=[...conflictsAt(t,te,null),...busyExtra.filter(b=>b.s<te&&b.e>t)];
      if(!c.length){if(deadline&&te>deadline&&day>0){}return{s:t,e:te}}
      t=new Date(Math.max(...c.map(b=>+b.e)));t=roundUp(addM(t,-1),5)}
  }
  return null;
}
function openSmart(){
  const now=new Date();
  const tasks=S.items.filter(i=>i.type==='task'&&!isDone(i)&&!i.start&&!i.inbox).sort(taskSort).slice(0,12);
  const plan=[],extra=[];
  for(const t of tasks){const dur=t.est||30;const dl=t.due?addD(sod(P(t.due)),1):null;const sl=freeSlot(addM(now,10),dur,dl,extra);if(!sl)continue;extra.push({s:sl.s,e:addM(sl.e,S.settings.buffer||0)});plan.push({t,s:sl.s,e:sl.e,late:dl&&sl.e>dl})}
  openModal(`<div class="mh"><h3>✨ AI 智慧排程</h3><button class="ibtn" data-x>${ic('x')}</button></div><div class="mb">
    <p class="muted" style="margin-top:0">依照「逾期 → 優先級 → 截止日」排序，把 ${tasks.length} 項未排程任務放入工作時段（${S.settings.workStart}:00–${S.settings.workEnd}:00）的空檔，並自動避開既有行程與保護時段，任務間保留 ${S.settings.buffer} 分鐘緩衝。</p>
    ${plan.length?plan.map((p,i)=>`<label class="list-row" style="cursor:pointer"><input type="checkbox" checked data-i="${i}"><span class="dot" style="--c:${PRI[p.t.priority].c}"></span><span style="flex:1">${esc(p.t.title)}${p.late?' <span style="color:var(--danger);font-size:12px">（晚於截止日）</span>':''}</span><span class="muted" style="font-variant-numeric:tabular-nums">${fmtMD(p.s)} 週${WDN[p.s.getDay()]} ${hm(p.s)}–${hm(p.e)}</span></label>`).join(''):'<div class="empty">沒有需要排程的任務（收集箱的項目請先整理）。</div>'}
    <div class="note" style="margin-top:12px">💡 任務可在編輯視窗設定「預估時間」，排程會更準確。之後也能直接在週/日檢視拖曳調整。</div></div>
    <div class="mf"><span class="grow"></span><button class="btn" data-x>取消</button>${plan.length?'<button class="btn pri" data-apply>套用排程</button>':''}</div>`,{init:m=>m.addEventListener('click',e=>{
      if(e.target.closest('[data-x]'))closeModal();
      if(e.target.closest('[data-apply]')){const sel=$$('input[data-i]:checked',m).map(x=>plan[+x.dataset.i]);commit(()=>{for(const p of sel){const it=getItem(p.t.id);it.start=iso(p.s);it.end=iso(p.e)}},`✨ 已排入 ${sel.length} 項任務`);closeModal();if(U.view!=='calendar'){U.view='calendar';U.cal='week';render()}}
    })});

function onDrop(src,tgt,mins){
  const {id,occ}=parseKey(src.key);const it=getItem(id);if(!it)return;

      else{it.due=it.due&&it.due.length>10?val+it.due.slice(10):val}

let fired=new Set();try{fired=new Set(JSON.parse(LS.get(FIRED_KEY)||'[]'))}catch{}

function reminderList(from,to){

    if(it.start){for(const o of occs(it,addM(from,-1440*2),addM(to,it.remind+1))){if(it.allDay)continue;const at=addM(o.s,-it.remind);if(at>from&&at<=to)out.push({key:o.key+'#'+it.remind,at,it,s:o.s})}}
    else if(it.due){const s=it.due.length>10?P(it.due):addM(P(it.due),S.settings.workStart*60),at=addM(s,-it.remind);if(at>from&&at<=to)out.push({key:it.id+'@due'+it.due+'#'+it.remind,at,it,s})}}

  return out;
}

  const L=reminderList(new Date(last),now).filter(r=>!fired.has(r.key));

  if(L.length){const arr=[...fired].slice(-500);fired=new Set(arr);LS.set(FIRED_KEY,JSON.stringify(arr))}
  const before=S.snoozes.length;S.snoozes=S.snoozes.filter(z=>z.at>+now-864e5);if(S.snoozes.length!==before)save();
  LS.set(LAST_KEY,String(+now));

async function notifPermission(quiet){

    </div></div>`,{init:m=>m.addEventListener('click',async e=>{

const gDate=s=>s.replace(/[-:]/g,'').slice(0,13)+'00';
function rrule(R){if(!R)return'';const map={daily:'DAILY',weekly:'WEEKLY',monthly:'MONTHLY',yearly:'YEARLY',weekdays:'WEEKLY'};let r='FREQ='+map[R.freq];if((R.interval||1)>1)r+=';INTERVAL='+R.interval;const BD=['SU','MO','TU','WE','TH','FR','SA'];

const gmailCompose=(to,su,body)=>'https://mail.google.com/mail/?'+new URLSearchParams({view:'cm',fs:'1',to:to||'',su,body}).toString();

// ---- ICS ----
const icsEsc=t=>String(t||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/([,;])/g,'\\$1');
const icsUn=t=>String(t||'').replace(/\\n/gi,'\n').replace(/\\([,;\\])/g,'$1');
function toICS(items,invite){
  const st=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//TimeButler//ZH-TW','CALSCALE:GREGORIAN',invite?'METHOD:REQUEST':'METHOD:PUBLISH'];
  for(const it of items){
    if(it.start){L.push('BEGIN:VEVENT','UID:'+it.id+'@timebutler','DTSTAMP:'+st);
      if(it.allDay)L.push('DTSTART;VALUE=DATE:'+it.start.slice(0,10).replace(/-/g,''),'DTEND;VALUE=DATE:'+ymd(addD(P((it.end||it.start).slice(0,10)),1)).replace(/-/g,''));
      else L.push('DTSTART;TZID='+TZ+':'+gDate(it.start),'DTEND;TZID='+TZ+':'+gDate(it.end||iso(addM(P(it.start),60))));
      L.push('SUMMARY:'+icsEsc(it.title));const desc=[it.notes,it.meet&&('會議連結：'+it.meet)].filter(Boolean).join('\n');if(desc)L.push('DESCRIPTION:'+icsEsc(desc));if(it.meet)L.push('LOCATION:'+icsEsc(it.meet),'URL:'+it.meet);
      if(S.settings.ownerEmail&&invite)L.push('ORGANIZER;CN='+icsEsc(S.settings.ownerName||S.settings.ownerEmail)+':mailto:'+S.settings.ownerEmail);
      const r=rrule(it.repeat);if(r)L.push('RRULE:'+r);(it.exdates||[]).forEach(x=>L.push('EXDATE;TZID='+TZ+':'+x.replace(/-/g,'')+'T'+it.start.slice(11).replace(':','')+'00'));
      if(it.remind!=null)L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(it.title),'TRIGGER:-PT'+it.remind+'M','END:VALARM');
      L.push('END:VEVENT')}
    else if(it.type==='task'){L.push('BEGIN:VTODO','UID:'+it.id+'@timebutler','DTSTAMP:'+st,'SUMMARY:'+icsEsc(it.title));if(it.due)L.push(it.due.length>10?'DUE;TZID='+TZ+':'+gDate(it.due):'DUE;VALUE=DATE:'+it.due.replace(/-/g,''));if(it.notes)L.push('DESCRIPTION:'+icsEsc(it.notes));L.push('PRIORITY:'+[0,9,5,1][it.priority],'STATUS:'+(isDone(it)?'COMPLETED':'NEEDS-ACTION'),'END:VTODO')}
  }
  L.push('END:VCALENDAR');
  return L.map(l=>{if(l.length<=74)return l;const parts=[];let s=l;while(s.length>74){parts.push(s.slice(0,74));s=' '+s.slice(74)}parts.push(s);return parts.join('\r\n')}).join('\r\n');
}
function parseICS(txt){
  const lines=txt.replace(/\r?\n[ \t]/g,'').split(/\r?\n/);const out=[];let cur=null,alarm=false;
  for(const ln of lines){
    if(ln==='BEGIN:VEVENT'||ln==='BEGIN:VTODO'){cur={_t:ln.slice(6)};continue}
    if(!cur)continue;if(ln==='BEGIN:VALARM'){alarm=true;continue}if(ln==='END:VALARM'){alarm=false;continue}

function stamp(){
  if(!lastSaved)return;let prev;try{prev=JSON.parse(lastSaved)}catch{return}
  const now=Date.now();S.deleted=S.deleted||{};
  // 時間戳一律大於前一版，避免兩台裝置時鐘誤差造成修改或刪除被舊資料蓋回
  for(const c of COLS){const bm=new Map((prev[c]||[]).map(x=>[x.id,{s:JSON.stringify(x),u:x.upd||0}]));const ids=new Set();
    for(const x of S[c]){ids.add(x.id);const p=bm.get(x.id);if(!p||p.s!==JSON.stringify(x))x.upd=Math.max(now,(p?p.u:0)+1);delete S.deleted[x.id]}

}
function mergeData(L,R){
  const del={...(R.deleted||{})};for(const [k,v] of Object.entries(L.deleted||{}))del[k]=Math.max(del[k]||0,v);
  const out={...R,...L};
  for(const c of COLS){const m=new Map();for(const x of R[c]||[])m.set(x.id,x);
    for(const x of L[c]||[]){const r=m.get(x.id);if(!r||(x.upd||0)>=(r.upd||0))m.set(x.id,x)}
    out[c]=[...m.values()].filter(x=>!(del[x.id]>=(x.upd||0)))}

const b64e=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const b64d=s=>JSON.parse(decodeURIComponent(escape(atob(s.replace(/-/g,'+').replace(/_/g,'/')))));
function bookableSlots(){
  const s=S.settings,len=s.slotLen,buf=s.buffer,now=addM(new Date(),60),out={};
  for(let i=0;i<s.bookHorizon;i++){const d=addD(sod(new Date()),i);if(!s.bookDays.includes(d.getDay()))continue;const L=[];
    for(let m=s.workStart*60;m+len<=s.workEnd*60;m+=len){const st=addM(d,m),en=addM(st,len);if(st<now)continue;if(!conflictsAt(addM(st,-buf),addM(en,buf),null).length)L.push(m)}
    if(L.length)out[ymd(d).replace(/-/g,'')]=L}
  return out;
}

function toggleDone(id){
  const it=getItem(id);if(!it)return;
  if(it.type!=='task')return;
  if(isDone(it)){commit(()=>{it.status='todo';it.doneAt=null},'已標記為未完成');return}
  if(it.repeat&&(it.due||it.start)){
    commit(()=>{const cur=P(it.start||it.due);const nx=nextAfter(it,cur);it.completions=(it.completions||0)+1;it.subtasks.forEach(s=>s.done=false);
      if(nx){const delta=nx-cur;if(it.start){it.start=iso(new Date(+P(it.start)+delta));it.end=iso(new Date(+P(it.end)+delta))}if(it.due)it.due=it.due.length>10?iso(new Date(+P(it.due)+delta)):ymd(new Date(+P(it.due)+delta));return nx}
      it.status='done';it.doneAt=Date.now()},nx=>nx?`✅ 完成本次！下次：${fmtMD(nx)}`:'✅ 已完成');return}
  commit(()=>{it.status='done';it.doneAt=Date.now();it.inbox=false},`🎉 完成「${esc(it.title)}」`);
}

  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openCapture();return}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!typing&&!isModal()){e.preventDefault();undo();return}
  if(typing||isModal()||e.ctrlKey||e.metaKey||e.altKey)return;
  const k=e.key;const go=v=>{U.view=v;render()};
  const map={q:()=>openCapture(),e:()=>openEditor(null,null,{type:'event'}),t:()=>openEditor(null,null,{type:'task'}),
    m:()=>{U.view='calendar';U.cal='month';render()},w:()=>{U.view='calendar';U.cal='week';render()},d:()=>{U.view='calendar';U.cal='day';render()},
    arrowleft:()=>U.view==='calendar'&&shift(-1),arrowright:()=>U.view==='calendar'&&shift(1),j:()=>U.view==='calendar'&&shift(-1),k:()=>U.view==='calendar'&&shift(1),
    '.':()=>{U.cursor=sod(new Date());render()},home:()=>{U.cursor=sod(new Date());render()},'/':()=>$('#q').focus(),s:openSmart,b:()=>openBooking(),p:pToggle,'?':openHelp,
    '1':()=>go('calendar'),'2':()=>go('inbox'),'3':()=>go('tasks'),'4':()=>go('kanban'),'5':()=>go('notes'),'6':()=>go('focus'),'7':()=>go('habits')};
  const f=map[k.toLowerCase()];if(f){e.preventDefault();f()}
});

else{
  if(S.seeded&&!LS.get(KEY))save();
  render();
  if(location.hash==='#capture'){openCapture();history.replaceState(null,'',location.pathname+location.search)}
  checkReminders();setInterval(checkReminders,15000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden){checkReminders();if(U.view==='calendar')render();if(S.settings.cloudSync&&tokenOK())syncNow(false)}});
  if(S.settings.gClientId&&location.protocol!=='file:')gLoad().catch(()=>{});
  if(S.settings.cloudSync&&S.settings.gClientId)setCS('login');

  setInterval(()=>{const nl=$('.nowline');if(nl)nl.style.top=minsOf(new Date())/60*HOUR+'px'},60000);
  addEventListener('online',renderSide);addEventListener('offline',renderSide);
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>renderTop());
}
